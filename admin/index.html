<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Hotel Aalayaa</title>
<style>
:root{--leaf:#1D5A3E;--bg:#F3F6EE}
body{margin:0;font-family:system-ui;background:var(--bg)}
header{background:var(--leaf);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.col{background:#fff;border:1px solid #d8e0d1;border-radius:12px;padding:10px;min-height:300px}
.card{border:1px solid #d8e0d1;border-radius:10px;padding:10px;margin:8px 0;background:#fff}
.badge{background:#EDA91B;padding:2px 8px;border-radius:999px}
</style>
</head>
<body>
<header><div><strong>Hotel Aalayaa Admin</strong></div><div><a href="/admin/logout" style="color:#fff">Logout</a></div></header>
<div class="wrap">
<h2>Live Orders Board</h2>
<div class="cols">
<div class="col"><h3>New <span id="b-new" class="badge">0</span></h3><div id="col-new"></div></div>
<div class="col"><h3>Preparing</h3><div id="col-preparing"></div></div>
<div class="col"><h3>Ready</h3><div id="col-ready"></div></div>
<div class="col"><h3>Out for delivery</h3><div id="col-out_for_delivery"></div></div>
<div class="col"><h3>Completed</h3><div id="col-completed"></div></div>
<div class="col"><h3>Cancelled</h3><div id="col-cancelled"></div></div>
</div>
</div>
<script>
let lastCount=0;
async function load(){
  const r=await fetch('/admin/api/orders');
  const orders=await r.json();
  const counts={new:0};
  ['new','preparing','ready','out_for_delivery','completed','cancelled'].forEach(s=>document.getElementById('col-'+s).innerHTML='');
  orders.forEach(o=>{
    counts[o.order_status]=(counts[o.order_status]||0)+1;
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<strong>${o.public_code}</strong><br>${o.branch_key} | ${o.type}<br>${o.customer_phone||''}<br><small>${o.items.map(i=>i.qty+'x '+i.name).join(', ')}</small><br>Total: ₹${o.total}<br>
    <select onchange="change('${o.id}',this.value)">
      <option value="new" ${o.order_status==='new'?'selected':''}>New</option>
      <option value="preparing" ${o.order_status==='preparing'?'selected':''}>Preparing</option>
      <option value="ready" ${o.order_status==='ready'?'selected':''}>Ready</option>
      <option value="out_for_delivery" ${o.order_status==='out_for_delivery'?'selected':''}>Out for delivery</option>
      <option value="completed" ${o.order_status==='completed'?'selected':''}>Completed</option>
      <option value="cancelled" ${o.order_status==='cancelled'?'selected':''}>Cancelled</option>
    </select>`;
    document.getElementById('col-'+o.order_status).appendChild(div);
  });
  document.getElementById('b-new').textContent=counts.new||0;
  if((counts.new||0)>lastCount && lastCount>=0){ try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=').play(); }catch(e){} }
  lastCount=counts.new||0;
}
async function change(id,s){ await fetch('/admin/api/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})}); load(); }
setInterval(load,4000);
load();
</script>
</body>
</html>
